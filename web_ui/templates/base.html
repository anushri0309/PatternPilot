<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pattern Pilot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark">
                <svg viewBox="0 0 40 40"><path d="M9 29 28 8l3 3-19 21M12 26l5 4M22 15l4 4"/><circle cx="29.5" cy="8.5" r="2.2"/></svg>
            </span>
            <span>pattern <b>pilot</b></span>
        </a>
        <nav class="topnav">
            <a href="/">The process</a>
            {% if session.get('authenticated') %}
                <a href="/studio">Studio</a>
                <a class="nav-cta" href="/logout">Logout</a>
            {% else %}
                <a href="/login">Login</a>
                <a class="nav-cta" href="/login">Make a pattern ↗</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
